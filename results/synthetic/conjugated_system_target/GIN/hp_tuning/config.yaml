model:
  embedding_dim:
    name: embedding_dim
    type: categorical
    choices: [32, 64, 128, 256]
  c_hidden:
    name: c_hidden
    type: categorical
    choices: [64, 128, 256, 512]
  num_layers:
    name: num_layers
    type: categorical
    choices: [2, 3, 4]
  norm_func:
    name: norm_func
    type: categorical
    choices: ["batch_norm", "layer_norm", "graph_norm"]
  dp_rate:
    name: dp_rate
    type: float
    low: 0.1
    high: 0.3
  c_hidden_head:
    name: c_hidden_head
    type: categorical
    choices: [64, 128, 256, 512]
  dp_rate_head:
    name: dp_rate_head
    type: float
    low: 0.1
    high: 0.5
  feature_provider: pytorch_geometric
  scale_features: false
training:
  lr:
    name: lr
    type: float
    low: 1e-4
    high: 1e-2
    log: True
  initial_warm_up_epochs:
    name: initial_warm_up_epochs
    type: categorical
    choices: [5, 10, 15, 20]
  batch_size:
    name: batch_size
    type: categorical
    choices: [64, 128, 256]
  weight_decay:
    name: weight_decay
    type: float
    low: 1e-5
    high: 1e-2
    log: True
  dataset_folder_path: /projects/prjs1679/Data/logP/largest_conjugated_system
  moving_avg_window: 5
  early_stopping_patience: 100
  early_stopping_delta: 0.00001
  keep_n_checkpoints: 1
  model_name: GIN
  num_epochs: 500
  output_dir_path: /projects/prjs1679/Experiments/logP/conjugated_system_target/GIN/hp_tuning
  target_column_name: Target
  val_frequency: 1
  wandb_group_name: 'GIN HP Tuning Conjugated System Target (with pruning)'
  wandb_project_name: Faithfulness_Test
