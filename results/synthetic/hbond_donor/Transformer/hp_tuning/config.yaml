model:
  d_model:
    name: d_model
    type: categorical
    choices: [64, 128, 256, 512]
  heads:
    name: heads
    type: categorical
    choices: [1, 2, 4]
  dim_feedforward:
    name: dim_feedforward
    type: categorical
    automatically_set: true
  dp_rate:
    name: dp_rate
    type: float
    low: 0.1
    high: 0.3
  num_layers:
    name: num_layers
    type: categorical
    choices: [2, 3, 4]
  c_hidden_head:
    name: c_hidden_head
    type: categorical
    choices: [64, 128, 256, 512]
  dp_rate_head:
    name: dp_rate_head
    type: float
    low: 0.1
    high: 0.5
  vocab_path: /projects/prjs1679/Data/logP/cleaned_and_filtered/tokenizer_vocab.txt
  max_seq_len: 100
training:
  lr:
    name: lr
    type: float
    low: 1e-4
    high: 1e-2
    log: True
  initial_warm_up_epochs:
    name: initial_warm_up_epochs
    type: categorical
    choices: [5, 10, 15, 20]
  batch_size:
    name: batch_size
    type: categorical
    choices: [64, 128, 256]
  weight_decay:
    name: weight_decay
    type: float
    low: 1e-5
    high: 1e-2
    log: True
  dataset_folder_path: /projects/prjs1679/Data/logP/hbond_donor
  moving_avg_window: 5
  early_stopping_patience: 100
  early_stopping_delta: 0.00001
  initial_warm_up_epochs: 10
  keep_n_checkpoints: 1
  model_name: Transformer
  num_epochs: 500
  output_dir_path: /projects/prjs1679/Experiments/logP/hbond_donor/Transformer/hp_tuning
  target_column_name: Target
  val_frequency: 1
  wandb_group_name: 'Transformer HP Tuning HBond Donor Target (with pruning)'
  wandb_project_name: Faithfulness_Test
