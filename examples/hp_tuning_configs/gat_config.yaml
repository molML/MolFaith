model:
  embedding_dim:
    name: embedding_dim
    type: categorical
    choices: [32, 64, 128, 256]
  c_hidden:
    name: c_hidden
    type: categorical
    choices: [64, 128, 256, 512]
  num_layers:
    name: num_layers
    type: categorical
    choices: [2, 3, 4]
  norm_func:
    name: norm_func
    type: categorical
    choices: ["batch_norm", "layer_norm", "graph_norm"]
  dp_rate:
    name: dp_rate
    type: float
    low: 0.1
    high: 0.3
  c_hidden_head:
    name: c_hidden_head
    type: categorical
    choices: [64, 128, 256, 512]
  dp_rate_head:
    name: dp_rate_head
    type: float
    low: 0.1
    high: 0.5
  heads:
    name: heads
    type: categorical
    choices: [1, 2, 4]
  negative_slope: 0.2
  dropout_gat_conv: 0.0
  concat: true
  feature_provider: pytorch_geometric
  scale_features: false
training:
  lr:
    name: lr
    type: float
    low: 1e-4
    high: 1e-2
    log: True
  initial_warm_up_epochs:
    name: initial_warm_up_epochs
    type: categorical
    choices: [5, 10, 15, 20]
  batch_size:
    name: batch_size
    type: categorical
    choices: [64, 128, 256]
  weight_decay:
    name: weight_decay
    type: float
    low: 1e-5
    high: 1e-2
    log: True
  dataset_folder_path: path/to/benzene_target
  moving_avg_window: 5
  early_stopping_patience: 100
  early_stopping_delta: 0.00001
  keep_n_checkpoints: 1
  model_name: GAT
  num_epochs: 500
  output_dir_path: path/to/output/folder
  target_column_name: Target
  val_frequency: 1
  wandb_group_name: group_name
  wandb_project_name: project_name
